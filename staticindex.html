<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>City Tycoon Mini App</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- AdsGram SDK -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #f4f6f8);
            color: var(--tg-theme-text-color, #1a1a1a);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }
        .container {
            background-color: var(--tg-theme-secondary-bg-color, #ffffff);
            width: 100%;
            max-width: 360px;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            text-align: center;
            box-sizing: border-box;
        }
        h2 {
            margin-top: 0;
            font-size: 22px;
        }
        .balance-card {
            background: rgba(0, 122, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            margin: 20px 0;
        }
        .balance-amount {
            font-size: 34px;
            font-weight: 700;
            color: #007aff;
            margin-top: 4px;
        }
        button {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s ease, opacity 0.2s ease;
        }
        button:active {
            transform: scale(0.98);
            opacity: 0.8;
        }
        .btn-claim {
            background-color: #34c759;
            color: #ffffff;
        }
        .btn-ad {
            background-color: #007aff;
            color: #ffffff;
        }
        .notice {
            font-size: 12px;
            color: #8e8e93;
            margin-top: 16px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🏭 City Tycoon</h2>
        
        <div class="balance-card">
            <div>Баланс:</div>
            <div class="balance-amount" id="balance">0</div>
        </div>

        <!-- Кнопка 1: обычный сбор прибыли -->
        <button class="btn-claim" onclick="claimDaily()">
            📦 Собрать прибыль (+10)
        </button>

        <!-- Кнопка 2: видео-бонус с явной пометкой -->
        <button class="btn-ad" onclick="watchVideoAd()">
            🎬 Видео-бонус (+50 монет)
        </button>

        <div class="notice">
            Просмотр рекламы доброволен и ускоряет развитие в игре.
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Получаем ID пользователя Telegram
        const userId = tg.initDataUnsafe?.user?.id || 12345;

        // Инициализация рекламного блока AdsGram
        // Замените YOUR_BLOCK_ID на Block ID из вашего кабинета AdsGram
        const AdController = window.Adsgram.init({ 
            blockId: "YOUR_BLOCK_ID" 
        });

        // Функция обычного сбора
        function claimDaily() {
            let current = parseInt(document.getElementById('balance').innerText);
            document.getElementById('balance').innerText = current + 10;
        }

        // Функция показа рекламы с вознаграждением
        function watchVideoAd() {
            AdController.show().then(() => {
                // Видео досмотрено до конца — начисляем награду
                let current = parseInt(document.getElementById('balance').innerText);
                document.getElementById('balance').innerText = current + 50;
            }).catch((err) => {
                // Ролик закрыт раньше времени или ошибка загрузки
                alert("Бонус не начислен: видеоролик нужно досмотреть до конца.");
            });
        }
    </script>
</body>
</html>
